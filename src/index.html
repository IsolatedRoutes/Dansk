<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('boot-error');
    var splash = document.getElementById('splash');
    if (splash) splash.remove();
    if (!document.getElementById('root').textContent) {

  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      // updateViaCache 'none' makes the browser check for a new sw.js every time.
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        reg.update();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(function () {});
    });
    // Reload once when a new service worker takes over, so a backgrounded
    // app never keeps running an old bundle.
    var refreshedOnce = false;
    navigator.serviceWorker && navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }
</script>
