`).forEach(e=>{let[t,n,r,a,i,s,d,l,g]=e.split("	");if(!t||!n)return;let p=fp[r]||"";Ea[p].push([t,n]),Wa[t.trim().toLowerCase()]={level:Number(a)||0,forms:i||"",gender:s||"",topic:p,cls:Tv[g]||"",tenseDa:d?d.split("|"):null,tenseEn:l?l.split("|"):null}});function vp(e){if(!e||e.type!=="word")return"";let t=Wa[(e.front||"").trim().toLowerCase()];if(t&&t.cls)return t.cls;if(e.pos)return e.pos;let n=(e.front||"").trim().toLowerCase();return n.startsWith("at ")?"verb":n.startsWith("en ")||n.startsWith("et ")?"noun":""}function xv(e){let t=(e.front||"").trim().toLowerCase();if(t.startsWith("en "))return"en";if(t.startsWith("et "))return"et";let n=e.gender||(Wa[t]||{}).gender||"";return n==="en"||n==="et"?n:""}function cp(e,t,n=!1){return t==="all"?n||e.type!=="grammar":t.startsWith("g:")?vp(e)===t.slice(2):e.category===t}function Kl(e){if(!e||e.type!=="word")return null;let t=Wa[(e.front||"").trim().toLowerCase()];return t&&t.tenseDa&&t.tenseEn?{da:t.tenseDa,en:t.tenseEn}:null}function ki(e){return Wa[(e||"").trim().toLowerCase()]||null}var nd=[{name:"Noun gender: en and et",was:["En/et gender"],level:1,rule:"Every Danish noun is either an en-word or an et-word. About three in four are en-words, but there's no reliable rule, so learn each noun with its en or et.",pattern:"**en** bil \xB7 **et** hus",examples:[["Jeg har **en** hund.","I have a dog."],["Vi bor i **et** hus.","We live in a house."],["Hun k\xF8ber **en** kop og **et** glas.","She buys a cup and a glass."]]},{name:"Definite form: -en and -et",was:["Definite articles as a suffix"],level:1,rule:"Danish says \u201Cthe\u201D with an ending on the noun, not a separate word. En-words add -en, et-words add -et (just -n or -t after an -e). In the plural, add -ne (or -ene if the plural has no ending).",pattern:"bil \u2192 bil**en** \xB7 hus \u2192 hus**et** \xB7 biler \u2192 biler**ne**",examples:[["Bil**en** er r\xF8d.","The car is red."],["Hus**et** er stort.","The house is big."],["B\xF8ger**ne** ligger p\xE5 bordet.","The books are on the table."]]},{name:"Plurals: -er, -e or no ending",was:["Plural noun patterns"],level:1,rule:"Most nouns add -er or -e in the plural, and some don't change at all. A few change their vowel, like mand \u2192 m\xE6nd, so learn the plural with the word.",pattern:"bil \u2192 bil**er** \xB7 hund \u2192 hund**e** \xB7 \xE5r \u2192 \xE5r",examples:[["Jeg har to **biler**.","I have two cars."],["Der er tre **hunde** i parken.","There are three dogs in the park."],["Han er ti **\xE5r** gammel.","He is ten years old."]]},{name:"Present tense: add -r",was:["Present tense has one form for every subject"],level:1,rule:"For the present tense, add -r to the verb (the ending is the same for every person: jeg, du, han, hun, vi, I and de). A few common verbs are irregular, like er, har, kan, vil and skal.",pattern:"at spise \u2192 spise**r** \xB7 at g\xE5 \u2192 g\xE5**r**",examples:[["Jeg **spiser** morgenmad.","I eat breakfast."],["Han **spiser** morgenmad.","He eats breakfast."],["De **g\xE5r** i skole.","They go to school."]]},{name:"Negation: ikke",was:["Negation with ikke"],level:1,rule:"Ikke means \u201Cnot\u201D. In a normal sentence it comes right after the verb (after the subject, if the subject comes after the verb), and there's no helper word like English \u201Cdon't\u201D. If there is only one verb and a short object like ham or det, ikke goes after the object: Jeg kender ham ikke. With two verbs it doesn't: Jeg kan ikke se ham.",pattern:"verb + **ikke**",examples:[["Jeg forst\xE5r **ikke**.","I don't understand."],["Hun er **ikke** hjemme.","She isn't home."],["Vi har **ikke** tid.","We don't have time."],["Jeg kender ham **ikke**.","I don't know him."]]},{name:"Questions: verb first",level:1,rule:"For a yes/no question, put the verb first and the subject second. With a question word like hvad or hvor, the question word comes first and the verb second.",pattern:"Du taler dansk. \u2192 **Taler du** dansk?",examples:[["**Taler du** dansk?","Do you speak Danish?"],["**Kommer hun** i morgen?","Is she coming tomorrow?"],["Hvor **bor du**?","Where do you live?"]]},{name:"Commands: the imperative",was:["Giving commands: the imperative"],level:1,rule:"To tell someone to do something, use the verb without at and without its final -e. If that leaves a double consonant at the end, write just one (lukke \u2192 luk, komme \u2192 kom). It's the same for one person or several.",pattern:"lukke \u2192 **luk** \xB7 komme \u2192 **kom** \xB7 g\xE5 \u2192 **g\xE5**",examples:[["**Luk** d\xF8ren!","Close the door!"],["**Kom** her!","Come here!"],["**V\xE6r** forsigtig!","Be careful!"]]},{name:"There is / there are: der er",was:["Der er \u2014 'there is/are'"],level:1,rule:"Der er means both \u201Cthere is\u201D and \u201Cthere are\u201D. It never changes, whether there's one thing or many.",pattern:"**der er** + noun \xB7 **er der** \u2026?",examples:[["**Der er** en kat i haven.","There is a cat in the garden."],["**Der er** mange mennesker her.","There are many people here."],["**Er der** en bager her i n\xE6rheden?","Is there a bakery near here?"]]},{name:"Pronouns: jeg and mig",was:["Personal pronouns: subject vs. object"],level:1,rule:"Most pronouns have one form for the person doing something and another for the person it's done to, like English I and me. Den and det (\u201Cit\u201D) never change.",pattern:"jeg/**mig** \xB7 du/**dig** \xB7 han/**ham** \xB7 hun/**hende** \xB7 vi/**os** \xB7 I/**jer** \xB7 de/**dem**",examples:[["Jeg kan se **dig**.","I can see you."],["Hun elsker **ham**.","She loves him."],["Kan du hj\xE6lpe **os**?","Can you help us?"]]},{name:"Possessives: min, mit, mine",was:["Possessive pronouns: min, mit, mine"],level:1,rule:"Min, din and sin change to match the noun: min with en-words, mit with et-words, mine with plurals. Hans, hendes, vores, jeres and deres never change.",pattern:"**min** bil \xB7 **mit** hus \xB7 **mine** b\xF8ger",examples:[["Det er **min** bil.","It's my car."],["Det er **mit** hus.","It's my house."],["Det er **mine** b\xF8ger.","They're my books."]]},{name:"Modal verbs: kan, skal, vil, m\xE5",was:["Modal verbs + bare infinitive"],level:1,rule:"After kan, skal, vil or m\xE5, the next verb comes straight after, without at. Most other verbs need at before the next verb.",pattern:"**kan** sv\xF8mme \xB7 pr\xF8ver **at** sv\xF8mme",examples:[["Jeg **kan sv\xF8mme**.","I can swim."],["Vi **skal g\xE5** nu.","We have to go now."],["Jeg vil pr\xF8ve **at sv\xF8mme**.","I want to try to swim."]]},{name:"Question words",level:1,rule:"Question words come first, then the verb, then the subject. If the question word is the subject itself, the verb just follows it: Hvem kommer? The main ones are hvad (what), hvem (who), hvor (where), hvorn\xE5r (when), hvorfor (why) and hvordan (how).",pattern:"**Hvor** bor **du**? \xB7 **Hvad** hedder **du**?",examples:[["**Hvad** hedder du?","What's your name?"],["**Hvem** er det?","Who is that?"],["**Hvorn\xE5r** kommer toget?","When does the train come?"],["**Hvordan** har du det?","How are you?"]]},{name:"Joining sentences: og, men, eller",level:1,rule:"Og (and), men (but) and eller (or) join two sentences without changing the word order. Each half stays a normal sentence.",pattern:"\u2026, **men** jeg arbejder stadig.",examples:[["Jeg er tr\xE6t, **men** jeg arbejder stadig.","I'm tired, but I'm still working."],["Hun l\xE6ser, **og** han ser fjernsyn.","She reads, and he watches TV."],["Vil du have te **eller** kaffe?","Do you want tea or coffee?"]]},{name:"Place: i and p\xE5",level:1,rule:"I means \u201Cin\u201D. P\xE5 means \u201Con\u201D or \u201Cat\u201D. Use i with countries and cities (i Danmark, i Aarhus), and p\xE5 with islands (p\xE5 Fyn) and many everyday places, like p\xE5 arbejde and p\xE5 kontoret.",pattern:"**i** Danmark \xB7 **p\xE5** Fyn \xB7 **p\xE5** arbejde",examples:[["Jeg bor **i** Aarhus.","I live in Aarhus."],["Bogen ligger **p\xE5** bordet.","The book is on the table."],["Hun er **p\xE5** arbejde.","She is at work."]]},{name:"Telling the time: klokken",level:1,rule:"Say klokken (\u201Co'clock\u201D) and then the number. Be careful with halv: it means half way to the next hour, so halv fire is 3:30, not 4:30.",pattern:"Klokken er **halv** fire = 3:30",examples:[["**Klokken** er otte.","It's eight o'clock."],["**Klokken** er halv fem.","It's half past four."],["Vi spiser **klokken** seks.","We eat at six o'clock."]]},{name:"Numbers: 21 and up",level:1,rule:"From 21 to 99, the ones come first and then og and the tens, so 25 is \u201Cfive-and-twenty\u201D. The tens 50 to 90 are unusual: halvtreds, tres, halvfjerds, firs, halvfems.",pattern:"21 = **en**og**tyve** \xB7 25 = **fem**og**tyve** \xB7 50 = halvtreds",examples:[["Jeg er femogtredive \xE5r.","I am thirty-five years old."],["Det koster niogfirs kroner.","It costs eighty-nine kroner."],["Hun er toogtyve \xE5r gammel.","She is twenty-two years old."]]},{name:"No capital letters",level:1,rule:"Danish uses small letters for days, months, languages and nationalities. Capitals are only for the start of a sentence and for names of people, places and so on.",pattern:"mandag \xB7 januar \xB7 dansk \xB7 dansker",examples:[["Vi ses i **januar**.","See you in January."],["Hun taler **dansk**.","She speaks Danish."],["Han er **dansker**.","He is Danish."]]},{name:"Owning something: the -s ending",level:1,rule:"To show who owns something, add -s to the owner. There is no apostrophe, except when the word already ends in s, x or z: then you write just an apostrophe (Jens' bog, Alex' cykel).",pattern:"Anna \u2192 Anna**s** bil \xB7 min mor \u2192 min mor**s** hus",examples:[["Det er Anna**s** bil.","It's Anna's car."],["Hvor er min mor**s** hus?","Where is my mother's house?"],["Jens**'** bog er ny.","Jens's book is new."]]},{name:"Many and much: mange, meget",level:1,rule:"Mange goes with things you can count (plural). Meget goes with things you can't count (singular). The same split is f\xE5 (few) and lidt (a little).",pattern:"**mange** venner \xB7 **meget** vand \xB7 **f\xE5** biler \xB7 **lidt** tid",examples:[["Jeg har **mange** venner.","I have many friends."],["Der er **meget** vand.","There is a lot of water."],["Jeg har kun **lidt** tid.","I only have a little time."]]},{name:"Liking things: kan lide",level:1,rule:"\u201CTo like\u201D is kan lide, and in positive sentences Danes usually add godt: kan godt lide (it doesn't change the meaning). Use at after it when the next word is a verb. For \u201Creally like\u201D, say kan rigtig godt lide. For people you care about, holde af is also common.",pattern:"Jeg **kan godt lide** kaffe \xB7 Jeg **kan lide at** sv\xF8mme",examples:[["Jeg **kan lide** kaffe.","I like coffee."],["Hun **kan lide at** sv\xF8mme.","She likes to swim."],["Jeg **holder af** dig.","I care about you."]]},{name:"It: den and det",level:1,rule:"For \u201Cit\u201D, use den for an en-word and det for an et-word. Det is also used when there is no real subject, like the weather.",pattern:"**Bilen** \u2192 **den** \xB7 **Huset** \u2192 **det** \xB7 **Det** regner",examples:[["Hvor er bilen? **Den** er der.","Where is the car? It is there."],["Hvor er huset? **Det** er der.","Where is the house? It is there."],["**Det** regner i dag.","It's raining today."]]},{name:"Jobs: no en or et",level:1,rule:"When you say what someone is, you usually leave out en or et. Add it back if you also use an adjective.",pattern:"Jeg er **l\xE6rer** \xB7 Hun er **en** god **l\xE6ge**",examples:[["Jeg er l\xE6rer.","I am a teacher."],["Han er kok.","He is a cook."],["Hun er **en** god l\xE6ge.","She is a good doctor."]]},{name:"Ja, nej and jo: answering a negative question",level:1,rule:"After a question with ikke, Danish uses jo for 'yes' and nej for 'no'. Plain ja is for questions without a negative. So 'Er du ikke tr\xE6t?' is answered 'Jo' if you are tired, and 'Nej' if you are not.",pattern:"Har du ikke tid? \u2192 **Jo**, det har jeg. \xB7 \u2192 **Nej**, det har jeg ikke.",examples:[["Kan du ikke lide kaffe? **Jo**, jeg kan godt lide kaffe.","Don't you like coffee? Yes, I do like coffee."],["Er du ikke tr\xE6t? **Nej**, jeg er ikke tr\xE6t.","Aren't you tired? No, I'm not tired."],["Har du ikke spist endnu? **Jo**, det har jeg.","Haven't you eaten yet? Yes, I have."]]},{name:"Modal verbs: what they really mean",level:1,rule:"Kan means can (ability or permission), skal means must or is going to, vil means want to, and m\xE5 means may or must. B\xF8r means should. Trap: m\xE5 ikke means must not, but beh\xF8ver ikke (at) means you don't have to.",pattern:"m\xE5 ikke = must not \xB7 **beh\xF8ver ikke** at = don't have to \xB7 **b\xF8r** = should",examples:[["Du **m\xE5 ikke** ryge her.","You must not smoke here."],["Du **beh\xF8ver ikke** at komme i morgen.","You don't have to come tomorrow."],["Du **b\xF8r** sove mere.","You should sleep more."]]},{name:"Opinions: synes, tror, t\xE6nker, mener",level:1,rule:"Synes is your personal opinion or feeling about something. Tror is a belief or guess when you are not sure. T\xE6nker means thinking, and 'think about' is t\xE6nke p\xE5. Mener is a firmer view, and also 'mean'.",pattern:"Jeg **synes** = I find \xB7 Jeg **tror** = I believe \xB7 t\xE6nke **p\xE5** = think about",examples:[["Jeg **synes**, at maden er god.","I think the food is good."],["Jeg **tror**, at han kommer i morgen.","I think he is coming tomorrow."],["Jeg **t\xE6nker** p\xE5 dig.","I am thinking of you."]]},{name:"Word order: verb second",was:["V2 word order (verb-second)"],level:2,rule:"In a main sentence the verb is always the second part. If something else comes first, like a time, the subject moves to just after the verb.",pattern:"I dag **g\xE5r jeg** i skole.",examples:[["Jeg **g\xE5r** i skole i dag.","I go to school today."],["I dag **g\xE5r jeg** i skole.","Today I go to school."],["I morgen **skal vi** rejse.","Tomorrow we are going to travel."]]},{name:"Adjectives: -t and -e endings",was:["Adjective agreement"],level:2,rule:"Adjectives change to match the noun: no ending with en-words, -t with et-words, and -e with plurals. Nationality words and adjectives in -isk (dansk, typisk) and adjectives already ending in -t (flot) don't add -t.",pattern:"en stor bil \xB7 et stor**t** hus \xB7 stor**e** huse",examples:[["Det er en **stor** hund.","It's a big dog."],["Det er et **stort** hus.","It's a big house."],["De har **store** huse.","They have big houses."]]},{name:"Definite + adjective: den store hund",was:["Double definiteness with adjectives"],level:2,rule:"With an adjective, \u201Cthe\u201D becomes a separate word in front (den, det or de) and the adjective takes -e. The noun then has no -en or -et ending.",pattern:"**den** stor**e** hund \xB7 **det** stor**e** hus \xB7 **de** stor**e** huse",examples:[["**Den store** hund sover.","The big dog is sleeping."],["**Det r\xF8de** hus er vores.","The red house is ours."],["**De nye** b\xF8ger er dyre.","The new books are expensive."]]},{name:"Comparison: -ere and -est",was:["Comparing adjectives: -ere and -est"],level:2,rule:"Add -ere for \u201Cmore\u201D and -est for \u201Cmost\u201D (before a noun with den/det/de, the superlative takes -e: den varmeste). Long adjectives use mere and mest instead, and a few common ones are irregular, like god, bedre, bedst.",pattern:"varm \u2192 varm**ere** \u2192 varm**est**",examples:[["Min bil er **hurtigere** end din.","My car is faster than yours."],["Det er den **bedste** film.","It's the best film."],["Bogen er **mere sp\xE6ndende**.","The book is more exciting."]]},{name:"Past tense: -ede and -te",was:["Simple past of regular verbs"],level:2,rule:"Most verbs add -ede or -te for the past tense, so learn which with each verb. Many common verbs are irregular, like gik and s\xE5.",pattern:"arbejd**ede** \xB7 spis**te** \xB7 gik",examples:[["Jeg **arbejdede** i g\xE5r.","I worked yesterday."],["Vi **spiste** fisk.","We ate fish."],["Hun **gik** hjem.","She went home."]]},{name:"Present perfect: har or er",was:["Present perfect: har vs. er"],level:2,rule:"Use har with the \u201Cdone\u201D form of the verb (the participle), like English \u201Chave done\u201D. Verbs about moving somewhere or changing, like rejse and blive, usually use er.",pattern:"**har** spist \xB7 **er** rejst \xB7 **er** blevet",examples:[["Jeg **har spist**.","I have eaten."],["Hun **er rejst** til Paris.","She has gone to Paris."],["Det **er blevet** koldt.","It has gotten cold."]]},{name:"Word order: after at, fordi, hvis",was:["Word order after fordi, hvis, n\xE5r, at"],level:2,rule:"After at, fordi, hvis, n\xE5r and da, the order is subject, then ikke or a short adverb, then the verb. This is different from a main sentence, where the verb comes before ikke.",pattern:"\u2026, fordi jeg **ikke har** tid.",examples:[["Jeg bliver hjemme, fordi jeg **ikke har** tid.","I'm staying home because I don't have time."],["Ring, hvis du **ikke kommer**.","Call if you're not coming."],["Han siger, at han **altid l\xE6ser** om aftenen.","He says that he always reads in the evening."]]},{name:"Future: skal and kommer til at",level:2,rule:"Danish often uses the present tense for the future. Skal is used for plans, and kommer til at for what's going to happen.",pattern:"jeg **ringer** i morgen \xB7 vi **skal** \u2026 \xB7 det **kommer til at** \u2026",examples:[["Jeg **ringer** i morgen.","I'll call tomorrow."],["Vi **skal** i biografen i aften.","We're going to the cinema tonight."],["Det **kommer til at** regne.","It's going to rain."]]},{name:"Reflexive verbs: sig",level:2,rule:"Some verbs need a word for \u201Coneself\u201D: mig, dig, sig, os or jer. Sig is used for han, hun, den, det and de. English often leaves it out.",pattern:"jeg gl\xE6der **mig** \xB7 han gl\xE6der **sig** \xB7 vi gl\xE6der **os**",examples:[["Jeg gl\xE6der **mig**.","I'm looking forward to it."],["Hun s\xE6tter **sig** ned.","She sits down."],["Vi skynder **os**.","We hurry."]]},{name:"Putting vs. being: l\xE6gge and ligge",was:["L\xE6gge/ligge, s\xE6tte/sidde, stille/st\xE5"],level:2,rule:"Danish has pairs of verbs: one for putting something somewhere, one for where it is. L\xE6gge, s\xE6tte and stille are the action; ligge, sidde and st\xE5 are the position.",pattern:"**l\xE6gge** \u2192 ligge \xB7 **s\xE6tte** \u2192 sidde \xB7 **stille** \u2192 st\xE5",examples:[["Jeg **l\xE6gger** bogen p\xE5 bordet.","I put the book on the table."],["Bogen **ligger** p\xE5 bordet.","The book is on the table."],["Glasset **st\xE5r** p\xE5 bordet.","The glass is on the table."]]},{name:"Past participles: -et and -t",level:2,rule:"The \u201Cdone\u201D form (participle) of a verb ends in -et if the past tense ends in -ede, and in -t if it ends in -te. Irregular verbs have their own, like g\xE5et and set.",pattern:"arbejde \u2192 arbejd**et** \xB7 k\xF8be \u2192 k\xF8bt \xB7 g\xE5 \u2192 g\xE5et",examples:[["Jeg har arbejd**et**.","I have worked."],["Vi har k\xF8bt br\xF8d.","We have bought bread."],["Han er g\xE5et hjem.","He has gone home."]]},{name:"Adverbs: the -t form",level:2,rule:"To say how something is done, Danish often uses the same -t form of the adjective as et-words do. Some adverbs, like flot, already end in t.",pattern:"hurtig \u2192 hurtig**t** \xB7 god \u2192 god**t**",examples:[["Han taler hurtig**t**.","He speaks quickly."],["Det g\xE5r god**t**.","It's going well."],["Hun synger flot.","She sings beautifully."]]},{name:"Det is + adjective with -t",level:2,rule:"When det (or a whole activity) is the subject and no noun follows, the adjective takes -t, even though there is no et-word.",pattern:"Det er dyr**t** \xB7 At rejse er dyr**t**",examples:[["Det er dejlig**t**.","It's lovely."],["Det er sv\xE6r**t**.","It is difficult."],["At rejse er dyr**t**.","Traveling is expensive."]]},{name:"Equal comparisons: lige s\xE5 \u2026 som",level:2,rule:"To say two things are equal, use lige s\xE5 and som. To say one is less, use ikke s\xE5 and som.",pattern:"**lige s\xE5** h\xF8j **som** \xB7 **ikke s\xE5** h\xF8j **som**",examples:[["Han er **lige s\xE5** h\xF8j **som** mig.","He is as tall as me."],["Jeg er **ikke s\xE5** h\xF8j **som** dig.","I'm not as tall as you."],["Det er **lige s\xE5** godt **som** f\xF8r.","It's just as good as before."]]},{name:"Compound words",level:2,rule:"Danish glues words together into one long word. The new word takes the gender of the last part, and sometimes an -s- or -e- joins the parts.",pattern:"bil + n\xF8gle = **biln\xF8gle** \xB7 arbejde + dag = **arbejdsdag**",examples:[["en **biln\xF8gle**","a car key"],["en **arbejdsdag**","a working day"],["et **sommerhus**","a summer house"]]},{name:"When: da and n\xE5r",level:2,rule:"Both mean \u201Cwhen\u201D. Use da for one time in the past, and n\xE5r for the present, the future, or something that happens again and again.",pattern:"**Da** jeg var barn\u2026 \xB7 **N\xE5r** jeg har tid\u2026",examples:[["**Da** jeg var barn, boede jeg her.","When I was a child, I lived here."],["**N\xE5r** jeg har tid, l\xE6ser jeg.","When I have time, I read."],["Ring, **n\xE5r** du kommer hjem.","Call when you get home."]]},{name:"Verbs with particles: st\xE5 op, tage p\xE5",level:2,rule:"Many Danish verbs have a small word that goes with them, like st\xE5 op (get up) or tage p\xE5 (put on). If the verb has an object, the object goes between the verb and the small word, even in the infinitive: tage jakken p\xE5, tage den p\xE5.",pattern:"at **st\xE5 op** \xB7 Jeg **st\xE5r op** \xB7 at tage jakken **p\xE5**",examples:[["Jeg **st\xE5r op** klokken syv.","I get up at seven."],["Jeg skal **st\xE5 op** tidligt.","I have to get up early."],["Hun **tager** jakken **p\xE5**.","She puts the jacket on."]]},{name:"Questions inside a sentence",level:2,rule:"A question inside a longer sentence keeps the normal order: subject, then the verb. Use om for yes/no questions (\u201Cwhether\u201D).",pattern:"Jeg ved ikke, **hvor han bor**.",examples:[["Jeg ved ikke, **hvor han bor**.","I don't know where he lives."],["Kan du sige, **hvorn\xE5r toget kommer**?","Can you tell me when the train comes?"],["Hun spurgte, **om jeg kunne komme**.","She asked whether I could come."]]},{name:"Ordinal numbers and dates",level:2,rule:"Ordinals are f\xF8rste, anden, tredje, fjerde, femte and so on. Dates use den plus the ordinal, as in 'den f\xF8rste maj', and are written 1. maj. Anden changes to andet with et-words, as in det andet hus.",pattern:"**f\xF8rste** \xB7 **anden/andet** \xB7 **tredje** \xB7 **fjerde** \xB7 den **f\xF8rste** maj = 1. maj",examples:[["Min f\xF8dselsdag er **den f\xF8rste** maj.","My birthday is on the first of May."],["Det er min **anden** kop kaffe i dag.","It is my second cup of coffee today."],["Vi ses **den tredje** juli.","We will see each other on the third of July."]]},{name:"Man: one, you, they",level:2,rule:"Man is a general subject meaning 'one', 'you' or 'people'. It takes the same verb form as han and hun. It is only used as a subject, so after a verb or preposition Danish uses en instead.",pattern:"**man** + verb \xB7 **man** kan \xB7 kan **man**?",examples:[["**Man** kan ikke parkere her.","You can't park here."],["I Danmark spiser **man** ofte rugbr\xF8d.","In Denmark people often eat rye bread."],["Hvordan staver **man** dit navn?","How do you spell your name?"]]},{name:"Strong verbs: drikke, drak, drukket",level:2,rule:"Many common verbs do not add -ede or -te in the past. Instead the vowel changes, and the 'have' form (the past participle) usually ends in -et. These must be learned one by one.",pattern:"drikke \u2192 **drak** \u2192 **drukket** \xB7 skrive \u2192 **skrev** \u2192 **skrevet** \xB7 finde \u2192 **fandt** \u2192 **fundet**",examples:[["I g\xE5r **drak** jeg to kopper kaffe.","Yesterday I drank two cups of coffee."],["Hun har **skrevet** et brev.","She has written a letter."],["Vi **fandt** n\xF8glerne i bilen.","We found the keys in the car."]]},{name:"Frequency adverbs: altid, aldrig, ofte",level:2,rule:"Altid (always), ofte (often), nogle gange (sometimes), sj\xE6ldent (rarely) and aldrig (never) usually come right after the verb in a main clause. In a clause after at or fordi they come before the verb. If one starts the sentence, the verb comes next.",pattern:"Jeg tager **altid** bussen \xB7 ..., at jeg **altid** tager bussen \xB7 **Nogle gange** tager jeg bussen",examples:[["Jeg spiser **altid** morgenmad.","I always eat breakfast."],["Han kommer **sj\xE6ldent** for sent.","He rarely comes late."],["**Nogle gange** tager jeg cyklen p\xE5 arbejde.","Sometimes I take the bike to work."]]},{name:"Time prepositions: i, om, p\xE5, til, fra",level:2,rule:"Use i for the recent past and for lengths of time (i g\xE5r, i en time), om for 'in' a stretch of time from now (om en uge), p\xE5 for coming weekdays (p\xE5 mandag = next Monday), and til for holidays and deadlines (til jul). Fra means from, and efter and f\xF8r mean after and before.",pattern:"**i** g\xE5r \xB7 **om** en uge \xB7 **p\xE5** mandag \xB7 **til** jul \xB7 **fra** ni **til** fem \xB7 **efter** / **f\xF8r** arbejde",examples:[["Vi ses **p\xE5** mandag.","See you on Monday."],["Min bror kommer **om** en uge.","My brother is coming in a week."],["Vi bes\xF8ger mine for\xE6ldre **til** jul.","We are visiting my parents at Christmas."]]},{name:"Direction or place: ud/ude, ind/inde, hjem/hjemme",level:2,rule:"Danish has two forms for many place words. The short form shows movement towards somewhere (ud, ind, op, ned, hjem, hen). The longer form with -e shows where you are (ude, inde, oppe, nede, hjemme, henne).",pattern:"Jeg g\xE5r **ud** \u2192 Jeg er **ude** \xB7 **hjem** \u2192 **hjemme** \xB7 **hen** \u2192 **henne**",examples:[["Kom **ind**! Det er koldt der**ude**.","Come in! It is cold out there."],["Jeg skal **hjem** nu, men min mand er allerede **hjemme**.","I have to go home now, but my husband is already at home."],["Hvor er min telefon **henne**?","Where is my phone?"]]},{name:"More, less, fewer: mere, flere, f\xE6rre",level:2,rule:"Use mere and mindre with things you cannot count (mere tid, mindre vand), and flere and f\xE6rre with things you can count (flere biler, f\xE6rre b\xF8ger). The 'most' forms are mest, mindst, flest and f\xE6rrest, and they follow the same split.",pattern:"**mere** kaffe \xB7 **flere** venner \xB7 **f\xE6rre** biler \xB7 **mest** \xB7 **mindst** \xB7 **flest** \xB7 **f\xE6rrest**",examples:[["Jeg drikker **mere** kaffe end f\xF8r.","I drink more coffee than before."],["Der er **f\xE6rre** biler i byen om s\xF8ndagen.","There are fewer cars in town on Sundays."],["Hun har **mindst** tid om morgenen.","She has the least time in the morning."]]},{name:"Prepositions at the end of questions",level:2,rule:"In questions with hvad, hvem or hvor, Danish usually leaves the little word (om, med, p\xE5, efter) at the very end, just like casual English. Do not move it to the front the way a textbook English sentence might.",pattern:"Hvad taler du **om**? \xB7 Hvem bor du sammen **med**? \xB7 Hvad leder du **efter**?",examples:[["Hvad taler du **om**?","What are you talking about?"],["Hvem bor du sammen **med**?","Who do you live with?"],["Hvad leder du **efter**?","What are you looking for?"]]},{name:"Polite requests: kunne, m\xE5, ville",level:2,rule:"To ask politely, use Kunne du...? (could you), Ville du...? (would you) or M\xE5 jeg...? (may I) followed by a verb without 'at'. To order or ask for something, say Jeg vil gerne have... because Jeg vil have... sounds blunt.",pattern:"**Kunne du** hj\xE6lpe? \xB7 **Ville du** lukke d\xF8ren? \xB7 **M\xE5 jeg** l\xE5ne den? \xB7 **Jeg vil gerne have** kaffe",examples:[["**Kunne du** hj\xE6lpe mig med kufferten?","Could you help me with the suitcase?"],["**M\xE5 jeg** l\xE5ne din kuglepen?","May I borrow your pen?"],["**Jeg vil gerne have** en kop kaffe, tak.","I would like a cup of coffee, please."]]},{name:"Irregular plurals: b\xF8rn, m\xE6nd, f\xF8dder",level:2,rule:"A few common nouns change their vowel in the plural and must simply be learned. Some nouns, especially many et-words like \xE5r (year) and ben (leg), do not change at all in the plural.",pattern:"barn \u2192 **b\xF8rn** \xB7 mand \u2192 **m\xE6nd** \xB7 fod \u2192 **f\xF8dder** \xB7 bog \u2192 **b\xF8ger** \xB7 et \xE5r \u2192 to **\xE5r**",examples:[["Vi har to **b\xF8rn**.","We have two children."],["Mine **f\xF8dder** g\xF8r ondt.","My feet hurt."],["Hun har boet her i tre **\xE5r**.","She has lived here for three years."]]},{name:"If: hvis",level:3,rule:"Hvis (if) is followed by subject and verb. In the main part that comes after, the verb comes first. For something unlikely or imaginary, use the past tense after hvis and ville in the main part.",pattern:"**Hvis** jeg har tid, **kommer** jeg.",examples:[["**Hvis** det regner, bliver vi hjemme.","If it rains, we'll stay home."],["**Hvis** jeg havde tid, ville jeg komme.","If I had time, I would come."],["**Hvis** du vil, kan vi g\xE5.","If you want, we can go."]]},{name:"Who and which: som",level:3,rule:"Som links a description to a noun. It means \u201Cwho\u201D, \u201Cwhich\u201D or \u201Cthat\u201D. It can't be left out if it's the subject, but it can be left out if it's the object.",pattern:"Manden, **som** bor her, er l\xE6rer.",examples:[["Manden, **som** bor her, er l\xE6rer.","The man who lives here is a teacher."],["Det er bogen, **som** jeg l\xE6ser.","It's the book that I'm reading."],["Det er bogen, jeg l\xE6ser.","It's the book I'm reading."]]},{name:"The passive: -s and blive",level:3,rule:"To say something is done to something, add -s to the infinitive (lukke \u2192 lukkes) or use blive plus the past participle (bliver lukket). The -s form is mostly used in writing, signs and instructions, and with modal verbs (kan ses); blive is more common in everyday speech and in the past tense (blev bygget).",pattern:"D\xF8ren luk**kes** \xB7 Huset **bliver** bygget",examples:[["D\xF8ren luk**kes** klokken seks.","The door is closed at six."],["Brevet **bliver** sendt i dag.","The letter is being sent today."],["Huset **blev** bygget i 1990.","The house was built in 1990."]]},{name:"To do something: for at, uden at",level:3,rule:"Some small phrases take at and a verb: for at (in order to), uden at (without) and i stedet for at (instead of).",pattern:"**for at** l\xE6re \xB7 **uden at** sige \xB7 **i stedet for at** g\xE5",examples:[["Jeg l\xE6ser **for at** l\xE6re dansk.","I study in order to learn Danish."],["Hun gik **uden at** sige noget.","She left without saying anything."],["Vi blev hjemme **i stedet for at** g\xE5 ud.","We stayed home instead of going out."]]},{name:"His own or someone else's: sin and hans",level:3,rule:"Sin, sit and sine mean \u201Chis/her own\u201D and point back to the subject. Hans and hendes mean someone else's. For \u201Ctheir\u201D, use deres.",pattern:"Han tager **sin** bog \xB7 Hun ser **hans** bog",examples:[["Han tager **sin** bog.","He takes his (own) book."],["Hun ser **hans** bog.","She sees his (someone else's) book."],["Hun elsker **sin** mand.","She loves her (own) husband."]]},{name:"Past perfect: havde and var",level:3,rule:"For something that happened before another past event, use havde or var with the participle. It works like har and er in the present perfect.",pattern:"Jeg **havde** spist \xB7 Hun **var** rejst",examples:[["Jeg **havde** spist, da han kom.","I had eaten when he came."],["Hun **var** rejst, f\xF8r jeg ringede.","She had left before I called."],["Det **var** blevet m\xF8rkt.","It had gotten dark."]]},{name:"Let's: lad os, and lad = let",level:3,rule:"Lad os plus a verb means 'let's' (no 'at' before the verb). The verb lade also means 'let' or 'allow': lade + person + verb. The forms are lade, lader (now), lod (past) and lad (command).",pattern:"**Lad os** g\xE5 \xB7 Hun **lader** mig g\xE5 \xB7 Han **lod** os blive",examples:[["**Lad os** g\xE5 en tur.","Let's go for a walk."],["**Lad os** spise sammen i aften.","Let's eat together tonight."],["Min mor **lader** mig l\xE5ne bilen.","My mother lets me borrow the car."]]},{name:"Der as a placeholder subject",level:3,rule:"When the subject is something new or unspecified (en bus, noget), Danish often starts with der and puts the real subject after the verb. This is common with verbs like komme, bo and ske, and in passives. With a known subject, skip der: Bussen kommer.",pattern:"**Der** kommer en bus \xB7 **Der** bor en dame her \xB7 **Der** blev sagt noget",examples:[["**Der** kommer en bus om fem minutter.","A bus is coming in five minutes."],["**Der** bor en gammel dame ovenp\xE5.","An old lady lives upstairs."],["**Der** blev talt meget om det p\xE5 m\xF8det.","There was a lot of talk about it at the meeting."]]},{name:"Highlighting: det er ... der/som",level:3,rule:"To stress one part of a sentence, start with Det er, then the word you want to highlight, then a clause. If the highlighted word is the one doing the action, use der. If it is the object, use som, or often nothing at all.",pattern:"**Det er** mig, **der** har ret \xB7 **Det er** bilen, **som** jeg vil have",examples:[["**Det er** mig, **der** har ret.","I am the one who is right."],["**Det er** Maria, **der** har lavet maden.","It is Maria who made the food."],["**Det er** den r\xF8de bil, **som** jeg vil have.","It is the red car that I want."]]},{name:"Verbs with fixed prepositions",level:3,rule:"Many Danish verbs always come with a particular small word, and it often differs from English, so learn them as pairs. Common ones: t\xE6nke p\xE5, vente p\xE5, tale om, lede efter, gl\xE6de sig til and dr\xF8mme om.",pattern:"t\xE6nke **p\xE5** \xB7 vente **p\xE5** \xB7 tale **om** \xB7 lede **efter** \xB7 gl\xE6de sig **til** \xB7 dr\xF8mme **om**",examples:[["Jeg **venter p\xE5** bussen.","I am waiting for the bus."],["Vi **gl\xE6der** os **til** ferien.","We are looking forward to the holiday."],["Jeg **leder efter** mine n\xF8gler.","I am looking for my keys."]]},{name:"Adjectives with fixed prepositions",level:3,rule:"Like verbs, many adjectives take a set small word: glad for, god til, interesseret i, ked af and tr\xE6t af. They often differ from English, for example god til means 'good at'. Ked af can mean sad or sorry.",pattern:"glad **for** \xB7 god **til** \xB7 interesseret **i** \xB7 ked **af** \xB7 tr\xE6t **af**",examples:[["Jeg er **glad for** min nye lejlighed.","I am happy with my new flat."],["Han er rigtig **god til** at lave mad.","He is really good at cooking."],["Hun er **interesseret i** historie.","She is interested in history."]]},{name:"Attitude words: jo, nok, vel, bare",was:["Flavour words: jo, nok, vel, bare"],level:3,rule:"Small words like jo (as you know), nok (probably), vel (I suppose), bare (just), alts\xE5 (so, I mean) and skam (really, in fact) add attitude rather than facts. In a main clause they come right after the verb, or after the subject if the subject follows the verb (Det ved du jo godt), and before ikke: Det er jo ikke sandt. You can't translate them word for word, so learn them in whole sentences.",pattern:"Det er **jo** ikke sandt \xB7 Han kommer **nok** \xB7 Det er **vel** i orden?",examples:[["Det er **jo** ikke min skyld.","It's not my fault, you know."],["Han kommer **nok** for sent.","He'll probably be late."],["Jeg skal **bare** lige ringe til min mor.","I just need to call my mum quickly."]]},{name:"Modals in the perfect: har kunnet",level:3,rule:"To say 'have been able to / wanted to / had to', use har plus the special participle: kunnet, villet, skullet, m\xE5ttet. For 'should have / could have done', use the past modal plus have and a participle: 'skulle have ringet' means should have called.",pattern:"har ikke **kunnet** komme \xB7 skulle **have ringet** \xB7 kunne **have sagt**",examples:[["Jeg har ikke **kunnet** komme i dag.","I haven't been able to come today."],["Du **skulle have ringet** til mig.","You should have called me."],["Hun **kunne have sagt** det f\xF8r.","She could have said it earlier."]]},{name:"Would-be: ville and skulle in the past",level:3,rule:"After a past-tense verb like sagde or troede, Danish uses ville for 'would' (future seen from the past): 'Han sagde, at han ville komme'. Skulle can mean 'was supposed to' or 'was going on to', as in 'Hun skulle senere blive l\xE6ge'. Ville also gives polite or hypothetical 'would' with hvis.",pattern:"Han sagde, at han **ville** komme \xB7 Hun **skulle** blive l\xE6ge",examples:[["Han sagde, at han **ville** komme senere.","He said that he would come later."],["Jeg troede, at det **ville** regne.","I thought that it would rain."],["Hun **skulle** senere blive l\xE6ge.","She would later become a doctor."]]},{name:"Past participle as adjective: en lukket d\xF8r",level:3,rule:"A past participle (the verb form used after har, like lukket) can also work as an adjective. It stays the same with en- and et-words. In the plural and after den/det, -et becomes -ede (lukkede) and -t adds -e (brugte).",pattern:"en **lukket** d\xF8r \xB7 et **lukket** vindue \xB7 **\xF8delagte** planer",examples:[["Jeg fandt en **glemt** n\xF8gle p\xE5 bordet.","I found a forgotten key on the table."],["Han k\xF8bte en **brugt** bil.","He bought a used car."],["Vi smed de **\xF8delagte** planer ud.","We threw out the ruined plans."]]},{name:"Present participle: -ende",level:3,rule:"Add -nde to the infinitive (the 'to' form) to make words like sp\xE6ndende (exciting); if the infinitive doesn't end in -e, add -ende (g\xE5 \u2192 g\xE5ende). It works as an adjective or describes how someone does something: 'Hun kom gr\xE6dende'. It does not replace English '-ing' for actions in progress: 'I am reading' is just 'Jeg l\xE6ser'.",pattern:"sp\xE6nde \u2192 **sp\xE6ndende** \xB7 rinde \u2192 **rindende** \xB7 gr\xE6de \u2192 **gr\xE6dende**",examples:[["Filmen var meget **sp\xE6ndende**.","The film was very exciting."],["Der er **rindende** vand i hytten.","There is running water in the cabin."],["Hun kom **gr\xE6dende** ind i stuen.","She came into the living room crying."]]},{name:"Relative clauses with prepositions and hvis",level:3,rule:"In 'the man I talk to', the preposition goes at the end of the relative clause: 'den mand, jeg taler med'. Som can be left out when it stands for the object, not the subject. For 'whose' use hvis, which never changes for gender or number.",pattern:"den mand (som) jeg taler **med** \xB7 en pige, **hvis** far er pilot",examples:[["Det er den mand, jeg taler **med**.","That is the man I'm talking to."],["Det hus, som vi bor **i**, er meget gammelt.","The house we live in is very old."],["Jeg kender en pige, **hvis** far er pilot.","I know a girl whose father is a pilot."]]},{name:"The more\u2026the more: jo \u2026 desto",level:3,rule:"Use jo plus a comparative, then desto (or jo) plus a comparative: 'the more\u2026the more'. After desto + adjective the verb comes before the subject. For 'more and more', use stadig plus flere (with plural nouns) or mere.",pattern:"**jo** mere \u2026 **desto** bedre \xB7 **stadig flere** turister",examples:[["**Jo** mere jeg \xF8ver mig, **desto** bedre bliver jeg.","The more I practise, the better I get."],["**Jo** f\xF8r, **jo** bedre.","The sooner, the better."],["Der kommer **stadig flere** turister hvert \xE5r.","More and more tourists come every year."]]},{name:"Object first for emphasis: Bogen har jeg l\xE6st",level:3,rule:"To stress or contrast something, you can start with the object instead of the subject. The verb must still come second, so the subject moves behind it: 'Bogen har jeg l\xE6st'. Words like ikke and aldrig keep their place after the subject.",pattern:"Jeg har l\xE6st bogen \u2192 **Bogen** har jeg l\xE6st",examples:[["**Bogen** har jeg l\xE6st, men ikke filmen.","I've read the book, but not the film."],["**Kaffe** drikker jeg aldrig om aftenen.","Coffee I never drink in the evening."],["**Det** ved jeg ikke.","I don't know that."]]},{name:"S\xE5, derfor, alligevel: verb comes next",level:3,rule:"Adverbs such as s\xE5 (then), derfor (therefore), alligevel (anyway) and dog (however, formal) are not like og or men. When they start a clause, the verb must come right after them, before the subject: 'Derfor bliver jeg'.",pattern:"og **s\xE5 gik** vi \xB7 **Derfor bliver** jeg \xB7 **Alligevel gik** vi",examples:[["F\xF8rst spiste vi, og **s\xE5 gik** vi en tur.","First we ate, and then we went for a walk."],["Jeg er syg. **Derfor bliver** jeg hjemme.","I'm ill. That's why I'm staying at home."],["Det regnede. **Alligevel gik** vi en tur.","It was raining. We went for a walk anyway."]]},{name:"Tag questions: ikke? and ikke sandt?",level:3,rule:"To check that someone agrees, add a short tag at the end: ikke?, ikke sandt? (a bit more formal) or the casual ikke ogs\xE5?. Use jo to say yes to a negative question or statement, and never as a plain yes to a positive one.",pattern:"Det er koldt, **ikke**? \xB7 Du kommer, **ikke sandt**? \xB7 Kommer du ikke? \u2013 **Jo**!",examples:[["Det er koldt i dag, **ikke**?","It's cold today, isn't it?"],["Du kommer i morgen, **ikke sandt**?","You're coming tomorrow, right?"],["Kommer du ikke i aften? \u2013 **Jo**, selvf\xF8lgelig.","Aren't you coming tonight? \u2013 Yes, of course."]]},{name:"Negative words: ingen, intet, aldrig",level:3,rule:"Use ingen (no, for en-words and plurals), intet (no, for et-words, rather formal), ingenting (nothing) and aldrig (never). Danish does not stack negatives: use either ingen/ingenting, or ikke nogen/ikke noget, but not both together.",pattern:"ingen penge = ikke nogen penge \xB7 ingenting = ikke noget \xB7 aldrig + noget",examples:[["Jeg har **ingen** penge p\xE5 mig.","I have no money on me."],["Han siger **aldrig** noget.","He never says anything."],["Der er **ikke noget** at spise i huset.","There is nothing to eat in the house."]]},{name:"Quantity words: nogen, nogle, noget",level:3,rule:"Nogle means some (plural) and nogen usually means any, in questions and with ikke. For one thing, use nogen with en-words and noget with et-words. Alle means all, hver means each, enhver means any or every, and begge means both.",pattern:"**nogle** \xE6bler \xB7 **nogen** b\xF8rn \xB7 **noget** br\xF8d \xB7 **alle** \xB7 **begge**",examples:[["Har du **nogen** b\xF8rn?","Do you have any children?"],["Jeg har k\xF8bt **nogle** \xE6bler.","I have bought some apples."],["Vi kan **begge** lide kaffe.","We both like coffee."]]},{name:"Selv and selve: myself, itself",level:3,rule:"Selv means myself, yourself, itself and so on, and never changes form. Selve goes before a noun with the, and means the very or the actual thing itself. Selvom (even though) can also be written as two words, selv om; both are correct.",pattern:"Jeg gjorde det **selv** \xB7 **selve** byen \xB7 **selvom** / **selv om**",examples:[["Jeg lavede maden **selv**.","I made the food myself."],["**Selve** huset er ikke stort, men haven er dejlig.","The house itself isn't big, but the garden is lovely."],["**Selvom** det regner, g\xE5r vi en tur.","Even though it's raining, we're going for a walk."]]},{name:"Measures without 'of': en kop kaffe",level:3,rule:"Danish does not use a word for of after a measure. Say the measure with its own en or et, then the thing directly: no af, no article. Af is only used when you take part of a specific, definite thing: et stykke af kagen, et glas af den gode vin. In the plural only the measure changes.",pattern:"**en kop** kaffe \xB7 **et stykke** kage \xB7 **to flasker** vand",examples:[["Jeg vil gerne have **en kop kaffe**.","I would like a cup of coffee."],["M\xE5 jeg f\xE5 **et stykke kage**?","May I have a piece of cake?"],["Vi har k\xF8bt **to flasker vand**.","We have bought two bottles of water."]]},{name:"Fractions and amounts: halv, procent",level:3,rule:"Halv is an adjective and agrees: en halv, et halvt, halve. Halvanden means one and a half (halvandet with et-words). Danish writes decimals with a comma, so 2,5 is read two comma five. Fractions are en tredjedel, en fjerdedel; a quarter of an hour is usually et kvarter.",pattern:"**en halv** liter \xB7 **et halvt** \xE6ble \xB7 **halvanden** time \xB7 2**,**5 **procent**",examples:[["Jeg tager **en halv** liter m\xE6lk.","I'll take half a litre of milk."],["Det tog **halvanden** time.","It took an hour and a half."],["Prisen steg med 2**,**5 **procent**.","The price rose by 2.5 percent."]]},{name:"Each other: hinanden and -s verbs",level:3,rule:"Hinanden means each other and is used for actions going both ways. Do not use sig for this. Some verbs get an -s ending to show the same idea: m\xF8des (meet), ses (see each other), skiftes (take turns).",pattern:"Vi kender **hinanden** \xB7 Vi **m\xF8des** \xB7 Vi **ses** \xB7 De **skiftes**",examples:[["Vi har kendt **hinanden** i ti \xE5r.","We have known each other for ten years."],["Vi **m\xF8des** foran stationen klokken otte.","We'll meet in front of the station at eight o'clock."],["B\xF8rnene **skiftes** til at bruge computeren.","The children take turns using the computer."]]},{name:"Time and contrast: mens, inden, uanset",level:3,rule:"These words start a sub-clause, so ikke and other small words go before the verb. Mens means while, inden before, indtil until, efter at after, s\xE5 snart as soon as, selvom even though, and uanset no matter. When the sub-clause comes first, the main verb follows it directly.",pattern:"**mens** jeg laver mad \xB7 **inden** vi spiser \xB7 **uanset** hvad",examples:[["Han lyttede til radio, **mens** han lavede mad.","He listened to the radio while he cooked."],["Han ringede, **inden** han tog af sted.","He called before he left."],["**Uanset** hvad du siger, bliver jeg her.","No matter what you say, I'm staying here."]]},{name:"Indirect objects: giver ham bogen",level:3,rule:"With verbs like give, send and show, the person usually comes first with no little word: giver ham bogen. You can also put the thing first and add til: giver bogen til ham. The til version puts more focus on the person.",pattern:"Jeg giver **ham** bogen \xB7 Jeg giver bogen **til ham**",examples:[["Jeg giver **ham** bogen.","I'm giving him the book."],["Jeg giver bogen **til ham**, ikke til hende.","I'm giving the book to him, not to her."],["Kan du vise **mig** vejen?","Can you show me the way?"]]},{name:"Old subjunctive: L\xE6nge leve kongen",level:4,rule:"A few frozen phrases keep an old wish-form of the verb, which looks like the plain infinitive (leve, ske, v\xE6re, bevare) instead of the normal present tense. You can't build new sentences this way; learn them as set expressions, such as Gud bevare Danmark (God save Denmark).",pattern:"**leve** \xB7 **ske** lov \xB7 Gud **bevare** \xB7 det **v\xE6re** sig",examples:[["**L\xE6nge leve** kongen!","Long live the king!"],["**Gud ske lov**, du er kommet hjem i god behold.","Thank God you got home safely."],["**Det v\xE6re sig** venner eller familie, alle er velkomne.","Be it friends or family, everyone is welcome."]]},{name:"Formal writing: s\xE5fremt, idet, hvorledes",level:4,rule:"Written Danish, especially in official texts and literature, uses words that sound stiff in speech: s\xE5fremt (if), idet (as, just as; also since), hvorledes (how) and thi (for, because; now very old-fashioned). In everyday talk you would say hvis, da or n\xE5r, and hvordan. Dog (however, yet) and s\xE5ledes (thus) are common in writing but also fine in careful speech.",pattern:"hvis \u2192 **s\xE5fremt** \xB7 hvordan \u2192 **hvorledes** \xB7 fordi \u2192 **thi** \xB7 s\xE5dan \u2192 **s\xE5ledes**",examples:[["**S\xE5fremt** du ikke er tilfreds, kan du f\xE5 pengene tilbage.","If you are not satisfied, you can get your money back."],["Han smilede, **idet** han \xE5bnede d\xF8ren.","He smiled as he opened the door."],["Vi ved ikke, **hvorledes** det kunne ske.","We do not know how it could happen."]]},{name:"Group genitive: the s goes last",level:4,rule:"When two nouns or a longer phrase own something together, the -s goes on the very last word of the phrase, not on the noun that actually owns it. If each person owns something separately, each noun gets its own -s.",pattern:"kongen af Danmark**s** bil \xB7 min bror og s\xF8ster**s** hus",examples:[["**Kongen af Danmarks** f\xF8dselsdag fejres hvert \xE5r i maj.","The King of Denmark's birthday is celebrated every May."],["Vi m\xF8des i **min bror og s\xF8sters** hus.","We are meeting in my brother and sister's house (one shared house)."],["**Min brors og min s\xF8sters** huse ligger langt fra hinanden.","My brother's and my sister's houses are far from each other (two separate houses)."]]},{name:"Adjectives as nouns: de fattige",level:4,rule:"Danish lets an adjective stand alone as a noun, usually with den, de or det in front and an -e ending. Den gamle and de unge mean the old person and young people; det gode means the good thing, the good side. De fattige means the poor, as a group.",pattern:"**de** fattig**e** \xB7 **den** gaml**e** \xB7 **de** ung**e** \xB7 **det** god**e**",examples:[["**De fattige** har ofte ikke r\xE5d til tandl\xE6ge.","The poor often cannot afford a dentist."],["**De unge** flytter til byen, n\xE5r de er f\xE6rdige med skolen.","Young people move to the city when they finish school."],["**Det gode** ved planen er, at den er billig.","The good thing about the plan is that it is cheap."]]},{name:"Passive with modals: kan ses",level:4,rule:"To make a passive after kan, skal, m\xE5 or vil, put -s on the infinitive: se \u2192 ses, g\xF8re \u2192 g\xF8res. This is very common in writing and in set phrases like Det m\xE5 siges. It sounds more impersonal than man kan se.",pattern:"kan **ses** \xB7 skal **g\xF8res** \xB7 m\xE5 **siges**",examples:[["Det **kan ses** p\xE5 hende, at hun er tr\xE6t.","You can tell by looking at her that she is tired."],["Opgaven **skal g\xF8res** i dag.","The task has to be done today."],["Det **m\xE5 siges**, at hun har arbejdet h\xE5rdt.","It must be said that she has worked hard."]]},{name:"Verbs that only exist with -s",level:4,rule:"A handful of Danish verbs always keep an -s, even though they are not passive. Some look like an -s-free verb with a different meaning (finde = find, findes = exist; minde = remind, mindes = recall), so learn them as separate verbs: synes (think, seem), lykkes (succeed), mindes (recall), findes (exist), f\xE6rdes (move about) and trives (thrive, feel at home).",pattern:"**synes** \xB7 **lykkes** \xB7 **mindes** \xB7 **findes** \xB7 **f\xE6rdes** \xB7 **trives**",examples:[["Jeg **synes**, at maden er rigtig god.","I think the food is really good."],["Det **lykkedes** mig at f\xE5 billetter.","I managed to get tickets."],["B\xF8rnene **trives** p\xE5 den nye skole.","The children are thriving at the new school."]]},{name:"Counterfactual past: hvis jeg havde",level:4,rule:"To talk about something that did not happen, use havde plus the past participle in the hvis-part. In the result, Danish usually uses var or havde plus the participle where English says would have; ville have is also possible. You can also drop hvis and start with the verb: Havde jeg vidst det, ...",pattern:"**Hvis** jeg **havde** vidst det, **var** jeg ikke kommet \xB7 **Havde** jeg vidst det, ...",examples:[["**Hvis** jeg **havde** vidst det, **var** jeg ikke kommet.","If I had known, I wouldn't have come."],["**Havde** jeg vidst det, **var** jeg ikke kommet.","Had I known, I wouldn't have come."],["**Havde** det ikke regnet, **var** vi g\xE5et en tur.","If it hadn't rained, we would have gone for a walk."]]},{name:"Comparison clauses: end hvad, end at",level:4,rule:"After a comparative, end means than. It can be followed by a whole clause (end jeg troede, sometimes end hvad jeg troede) or by at plus a verb (end at g\xE6tte). Ikke andet end means nothing but, and mere end means more than.",pattern:"bedre **end** jeg troede \xB7 bedre **end at** g\xE6tte \xB7 **ikke andet end** \xB7 **mere end**",examples:[["Filmen var bedre, **end** jeg havde troet.","The film was better than I had thought."],["Det er bedre at sp\xF8rge **end at** g\xE6tte.","It is better to ask than to guess."],["Jeg \xF8nsker **ikke andet end** lidt ro.","I want nothing but a little peace."]]},{name:"Whatever and however: hvor \u2026 end",level:4,rule:"To say however or whatever, put end after the subject inside the clause: hvor hurtigt han end l\xF8ber, hvad du end siger. Uanset hvad, hvem or hvor means no matter what, who or where and is the everyday alternative. The main clause that follows often starts with its verb.",pattern:"**hvor** hurtigt han **end** l\xF8ber \xB7 **hvad** du **end** siger \xB7 **uanset** hvad/hvem",examples:[["**Hvor** hurtigt han **end** l\xF8ber, n\xE5r han ikke bussen.","However fast he runs, he won't catch the bus."],["**Hvad** du **end** siger, vil han ikke lytte.","Whatever you say, he won't listen."],["**Uanset hvad** der sker, kan du altid ringe til mig.","No matter what happens, you can always call me."]]},{name:"Nouns from verbs: -ing, -else, -hed, -skab",level:4,rule:"Danish builds nouns by adding endings: -ing or -else to verbs, -hed to adjectives, and -skab mostly to nouns. Nouns in -ing and -hed are en-words, -else nouns are nearly always en-words (but et v\xE6relse), and -skab nouns are usually et-words (et venskab), with exceptions like en egenskab. Learn each noun as a whole word.",pattern:"forklare \u2192 forklar**ing** \xB7 \xF8ve \u2192 \xF8v**else** \xB7 fri \u2192 fri**hed** \xB7 ven \u2192 ven**skab**",examples:[["Jeg har brug for en bedre **forklaring**.","I need a better explanation."],["Det er en god **\xF8velse** for begyndere.","It is a good exercise for beginners."],["**Frihed** er vigtig for mange mennesker.","Freedom is important to many people."]]},{name:"Useful prefixes: be-, for-, mis-, u-, ud-, over-",level:4,rule:"Prefixes change the meaning of a word: mis- means wrongly, u- means not or the opposite, ud- often means out or completely, and over- means over, above or too much (overse means overlook, miss). Be- and for- are less predictable, so learn those words as they come, for example bes\xF8ge and forklare.",pattern:"forst\xE5 \u2192 **mis**forst\xE5 \xB7 tilfreds \u2192 **u**tilfreds \xB7 fylde \u2192 **ud**fylde \xB7 se \u2192 **over**se",examples:[["Jeg har **mis**forst\xE5et sp\xF8rgsm\xE5let.","I have misunderstood the question."],["Hun var **u**tilfreds med svaret.","She was dissatisfied with the answer."],["Du skal **ud**fylde formularen.","You have to fill in the form."]]},{name:"Adjective endings: -lig, -som, -l\xF8s, -fuld",level:4,rule:"Endings turn words into adjectives. -lig, -ig and -som say that something has a quality (farlig, modig, hj\xE6lpsom), -agtig means like or resembling, -l\xF8s means without, and -fuld means full of. The result then takes the normal adjective endings (-t, -e).",pattern:"fare \u2192 far**lig** \xB7 mod \u2192 mod**ig** \xB7 hj\xE6lp \u2192 hj\xE6lp**som** \xB7 barn \u2192 barn**agtig** \xB7 hjem \u2192 hjem**l\xF8s** \xB7 v\xE6rdi \u2192 v\xE6rdi**fuld**",examples:[["Det er **farligt** at k\xF8re s\xE5 hurtigt.","It is dangerous to drive so fast."],["Han er altid meget **hj\xE6lpsom**.","He is always very helpful."],["Tak for dit **v\xE6rdifulde** r\xE5d.","Thank you for your valuable advice."]]},{name:"Light-verb phrases: tage en beslutning",level:4,rule:"Danish often uses a common verb plus a noun where English uses a single verb or a different verb. The pairing is fixed, so learn it as a unit: you stille a question, tage a decision, give besked and f\xF8re a conversation. Tr\xE6ffe is a slightly more formal choice for decisions and choices.",pattern:"**tage** en beslutning \xB7 **give** besked \xB7 **stille** et sp\xF8rgsm\xE5l \xB7 **f\xF8re** en samtale \xB7 **tr\xE6ffe** et valg",examples:[["Vi skal **tage en beslutning** inden fredag.","We have to make a decision before Friday."],["Kan du **give** mig **besked**, n\xE5r du er fremme?","Can you let me know when you have arrived?"],["M\xE5 jeg **stille** dig **et sp\xF8rgsm\xE5l**?","May I ask you a question?"]]},{name:"Commas with subordinate clauses",level:4,rule:"Many writers put a comma before a subordinate clause (starting with at, fordi, hvis, n\xE5r, som and so on). This comma has been optional since 2004, so you will see both styles; just be consistent within a text. A comma after a subordinate clause that comes first is always required.",pattern:"Jeg ved**,** at han kommer \xB7 N\xE5r du kommer**,** ringer jeg",examples:[["Jeg ved**,** **at** han kommer i morgen.","I know that he is coming tomorrow."],["Vi bliver hjemme**,** **fordi** det regner.","We are staying at home because it is raining."],["**Hvis** det regner**,** bliver vi hjemme.","If it rains, we will stay at home."]]},{name:"Formal letters and e-mails",level:4,rule:"Formal letters usually open with K\xE6re plus the person's full name, for example K\xE6re Lone Hansen (titles like fru and hr. now sound old-fashioned), and close with Med venlig hilsen and your name. Set phrases such as Jeg skriver for at ... and Jeg ser frem til ... keep the tone polite. In everyday work e-mails Hej and Mvh are common.",pattern:"**K\xE6re** Lone Hansen \xB7 **Jeg skriver for at** ... \xB7 **Jeg ser frem til** ... \xB7 **Med venlig hilsen**",examples:[["**K\xE6re** Lone Hansen,","Dear Lone Hansen,"],["**Jeg skriver for at** sp\xF8rge, om stillingen stadig er ledig.","I am writing to ask whether the position is still available."],["**Jeg ser frem til** dit svar. **Med venlig hilsen** Anna Nielsen","I look forward to your reply. Kind regards, Anna Nielsen"]]},{name:"Pronunciation: soft d, and g and r endings",level:4,rule:"Spelling and sound often differ in Danish. A d after a vowel is usually a soft, relaxed sound a bit like th in the English word the, not a hard d. Between vowels, g is often weak and may sound almost like a glide or vanish, and a final -er is often a short a-like sound.",pattern:"ma**d** \xB7 r\xF8**d** \xB7 ba**g**e \xB7 si**g**e \xB7 bag**er**",examples:[["
