ll match"],["et mesterskab","a championship"]]},mm=[{name:"En/et gender",explanation:"Danish nouns are either 'common gender' (using en) or 'neuter' (using et) \u2014 there's no reliable rule for which is which, so each noun's gender has to be learned along with the word itself. It affects the indefinite article, the definite ending, and how adjectives agree with the noun.",examples:[["en kop","a cup"],["et bord","a table"],["en stol","a chair"]]},{name:"Definite articles as a suffix",explanation:"Unlike English 'the', Danish usually shows definiteness by adding an ending onto the noun itself rather than using a separate word. En-words add -en, et-words add -et.",examples:[["hunden","the dog"],["huset","the house"],["bilen","the car"]]},{name:"V2 word order (verb-second)",explanation:"In a Danish main clause, the finite (conjugated) verb has to be the second grammatical element, no matter what comes first. If something other than the subject starts the sentence \u2014 like a time expression \u2014 the subject and verb swap places compared to how English would order them.",examples:[["Jeg g\xE5r i skole i dag.","I go to school today."],["I dag g\xE5r jeg i skole.","Today I go to school."],["I morgen skal vi rejse.","Tomorrow we will travel."]]},{name:"Negation with ikke",explanation:"In a main clause, 'ikke' (not) comes right after the finite verb. In a subordinate clause \u2014 one starting with a word like 'at', 'fordi', or 'hvis' \u2014 'ikke' moves to before the finite verb instead.",examples:[["Jeg forst\xE5r ikke.","I don't understand."],["Han sagde, at han ikke forstod.","He said that he didn't understand."],["Hvis du ikke kommer, ringer jeg.","If you don't come, I'll call."]]},{name:"Modal verbs + bare infinitive",explanation:"After a modal verb like kan, skal, vil, or m\xE5, the following verb is a plain infinitive with no 'at' (Danish's equivalent of 'to'). Most other verbs that take an infinitive DO require 'at' before it.",examples:[["Jeg kan sv\xF8mme.",           /* 100vh is unreliable on mobile Safari, which doesn't account
