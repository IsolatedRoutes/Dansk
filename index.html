ll match"],["et mesterskab","a championship"]]},cm=[{name:"En/et gender",explanation:"Danish nouns are either 'common gender' (using en) or 'neuter' (using et) \u2014 there's no reliable rule for which is which, so each noun's gender has to be learned along with the word itself. It affects the indefinite article, the definite ending, and how adjectives agree with the noun.",examples:[["en kop","a cup"],["et bord","a table"],["en stol","a chair"]]},{name:"Definite articles as a suffix",explanation:"Unlike English 'the', Danish usually shows definiteness by adding an ending onto the noun itself rather than using a separate word. En-words add -en, et-words add -et.",examples:[["hunden","the dog"],["huset","the house"],["bilen","the car"]]},{name:"V2 word order (verb-second)",explanation:"In a Danish main clause, the finite (conjugated) verb has to be the second grammatical element, no matter what comes first. If something other than the subject starts the sentence \u2014 like a time expression \u2014 the subject and verb swap places compared to how English would order them.",examples:[["Jeg g\xE5r i skole i dag.","I go to school today."],["I dag g\xE5r jeg i skole.","Today I go to school."],["I morgen skal vi rejse.","Tomorrow we will travel."]]},{name:"Negation with ikke",explanation:"In a main clause, 'ikke' (not) comes right after the finite verb. In a subordinate clause \u2014 one starting with a word like 'at', 'fordi', or 'hvis' \u2014 'ikke' moves to before the finite verb instead.",examples:[["Jeg forst\xE5r ikke.","I don't understand."],["Han sagde, at han ikke forstod.","He said that he didn't understand."],["Hvis du ikke kommer, ringer jeg.","If you don't come, I'll call."]]},{name:"Modal verbs + bare infinitive",explanation:"After a modal verb like kan, skal, vil, or m\xE5, the following verb is a plain infinitive with no 'at' (Danish's equivalent of 'to'). Most other verbs that take an infinitive DO require 'at' before it.",examples:[["Jeg kan sv\xF8mme.","I can swim."],["Jeg vil pr\xF8ve at sv\xF8mme.","I want to try to swim."],["Du skal huske det.","You must remember it."]]},{name:"Adjective agreement",explanation:"Danish adjectives change their ending depending on the noun they describe: no extra ending before a common-gender singular noun, -t before a neuter singular noun, and -e before any plural noun or in the definite form.",examples:[["en stor hund","a big dog"],["et stort hus","a big house"],["store huse","big houses"]]},{name:"Plural noun patterns",explanation:"Most Danish nouns form their plural with -er or -e, and a smaller group don't change at all. Which pattern a given noun follows isn't fully predictable, so it's usually learned alongside the word itself.",examples:[["en bil, biler","a car, cars"],["et \xE6ble, \xE6bler","an apple, apples"],["et hus, huse","a house, houses"]]},{name:"Present tense has one form for every subject",explanation:"Danish verbs don't change based on who's doing the action \u2014 jeg, du, han, vi, I, and de all use the exact same verb form in the present tense. This is simpler than English, which changes for 'he/she/it'.",examples:[["jeg g\xE5r","I go"],["han g\xE5r","he goes"],["de g\xE5r","they go"]]},{name:"Personal pronouns: subject vs. object",explanation:"Like English 'I' vs 'me', most Danish personal pronouns have a different form depending on whether they're the subject or the object of a verb \u2014 including after a preposition. Den and det ('it') are the exception: they stay the same either way.",examples:[["Jeg kan se dig.","I can see you."],["Hun elsker ham.","She loves him."],["Giv mig bogen.","Give me the book."]]},{name:"Simple past of regular verbs",explanation:"Most Danish verbs form the past tense by adding -ede or -te to the verb stem \u2014 which ending a given verb takes isn't fully predictable, so it's learned along with the verb. As in the present tense, there's no change based on who's doing the action.",examples:[["jeg elskede","I loved"],["hun talte
